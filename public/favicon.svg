<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="jp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="jp-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#jp-grad)" />
  <rect x="4" y="4" width="120" height="60" rx="32" fill="url(#jp-glow)" />
  <rect x="4" y="4" width="120" height="120" rx="32" fill="none" stroke="#5eead4" stroke-width="3" stroke-opacity="0.4" />

  <!-- Medical Cross Accent (Top Right) -->
  <g transform="translate(86, 22)">
    <circle cx="10" cy="10" r="14" fill="#ffffff" fill-opacity="0.18" />
    <path d="M10 5 v10 M5 10 h10" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
  </g>

  <!-- JP Monogram -->
  <text x="56" y="84"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="62"
        font-weight="900"
        letter-spacing="-2px"
        text-anchor="middle"
        fill="#ffffff">JP</text>
</svg>
